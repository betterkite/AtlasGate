<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b66"/>
    </marker>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3b32"/>
      <stop offset="1" stop-color="#087f6d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="860" height="560" rx="14" fill="#f4f7f6"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0d3b32">AtlasGate — Local LLM Infrastructure</text>
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#5b6b66">multi-protocol gateway · version-governed LLM Wiki · knowledge graph · evidence-first agent</text>

  <!-- Column headers -->
  <text x="150" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#3f6f93">CLIENTS</text>
  <text x="430" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#0d3b32">ATLASGATE</text>
  <text x="730" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#6d5a3f">STORAGE &amp; UPSTREAM</text>

  <!-- ============ Column 1: Clients ============ -->
  <g>
    <rect x="50" y="100" width="200" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="150" y="124" text-anchor="middle" font-size="12" fill="#26312e">Apps / SDKs (OpenAI · Anthropic)</text>

    <rect x="50" y="152" width="200" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="150" y="176" text-anchor="middle" font-size="12" fill="#26312e">Web console (build-free)</text>

    <rect x="50" y="204" width="200" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="150" y="228" text-anchor="middle" font-size="12" fill="#26312e">MCP tools</text>

    <rect x="50" y="256" width="200" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="150" y="280" text-anchor="middle" font-size="12" fill="#26312e">Clipper / imports (MD·TXT·PDF)</text>
  </g>

  <!-- ============ Column 2: AtlasGate ============ -->
  <g>
    <!-- gateway band -->
    <rect x="280" y="100" width="300" height="110" rx="10" fill="#eaf4f1" stroke="#087f6d" stroke-width="1.5"/>
    <text x="430" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#087f6d">GATEWAY</text>
    <rect x="295" y="130" width="270" height="30" rx="6" fill="#ffffff" stroke="#c8d6d2" stroke-width="1"/>
    <text x="430" y="149" text-anchor="middle" font-size="11" fill="#26312e">/v1/* — Chat · Responses · Anthropic · Embeddings · SSE</text>
    <rect x="295" y="168" width="270" height="30" rx="6" fill="#ffffff" stroke="#c8d6d2" stroke-width="1"/>
    <text x="430" y="187" text-anchor="middle" font-size="11" fill="#26312e">Routing · failover · quotas · budgets · audit ledger</text>

    <!-- knowledge band -->
    <rect x="280" y="224" width="300" height="226" rx="10" fill="#eef2fb" stroke="#3f6f93" stroke-width="1.5"/>
    <text x="430" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#3f6f93">KNOWLEDGE PLATFORM (LLM Wiki)</text>
    <rect x="295" y="254" width="270" height="30" rx="6" fill="#ffffff" stroke="#c8d6d2" stroke-width="1"/>
    <text x="430" y="273" text-anchor="middle" font-size="11" fill="#26312e">Ingest queue · two-step LLM compile (analysis → generation)</text>
    <rect x="295" y="292" width="270" height="30" rx="6" fill="#ffffff" stroke="#c8d6d2" stroke-width="1"/>
    <text x="430" y="311" text-anchor="middle" font-size="11" fill="#26312e">Version-governed pages — Change → merge → immutable Master</text>
    <rect x="295" y="330" width="270" height="30" rx="6" fill="#ffffff" stroke="#c8d6d2" stroke-width="1"/>
    <text x="430" y="349" text-anchor="middle" font-size="11" fill="#26312e">Knowledge graph — communities · 5-signal related edges</text>
    <rect x="295" y="368" width="270" height="30" rx="6" fill="#ffffff" stroke="#c8d6d2" stroke-width="1"/>
    <text x="430" y="387" text-anchor="middle" font-size="11" fill="#26312e">Agent — hybrid RRF retrieval · rewrite · multi-hop · citations</text>
    <rect x="295" y="406" width="270" height="30" rx="6" fill="#ffffff" stroke="#c8d6d2" stroke-width="1"/>
    <text x="430" y="425" text-anchor="middle" font-size="11" fill="#26312e">Lint · reviews · batch publication · md mirror · zip export</text>
  </g>

  <!-- ============ Column 3: Storage & upstream ============ -->
  <g>
    <rect x="620" y="100" width="220" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="730" y="116" text-anchor="middle" font-size="11" fill="#26312e">SQLite (WAL)</text>
    <text x="730" y="132" text-anchor="middle" font-size="10" fill="#5b6b66">pages · versions · ledger · vectors</text>

    <rect x="620" y="152" width="220" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="730" y="168" text-anchor="middle" font-size="11" fill="#26312e">knowledge/ md mirror</text>
    <text x="730" y="184" text-anchor="middle" font-size="10" fill="#5b6b66">Obsidian-ready, read-only</text>

    <rect x="620" y="204" width="220" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="730" y="220" text-anchor="middle" font-size="11" fill="#26312e">Local ONNX embedding</text>
    <text x="730" y="236" text-anchor="middle" font-size="10" fill="#5b6b66">bge-small-zh · offline</text>

    <rect x="620" y="256" width="220" height="40" rx="8" fill="#ffffff" stroke="#c8d6d2" stroke-width="1.2"/>
    <text x="730" y="272" text-anchor="middle" font-size="11" fill="#26312e">Upstream models</text>
    <text x="730" y="288" text-anchor="middle" font-size="10" fill="#5b6b66">DeepSeek · OpenAI · Anthropic</text>
  </g>

  <!-- Arrows: clients -> gateway -->
  <line x1="250" y1="120" x2="280" y2="130" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="250" y1="172" x2="280" y2="150" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="250" y1="224" x2="280" y2="170" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="250" y1="276" x2="280" y2="300" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Arrows: gateway <-> knowledge -->
  <line x1="430" y1="210" x2="430" y2="224" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Arrows: knowledge -> storage -->
  <line x1="580" y1="300" x2="620" y2="120" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="580" y1="340" x2="620" y2="172" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="580" y1="390" x2="620" y2="224" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Arrow: gateway -> upstream -->
  <line x1="580" y1="180" x2="620" y2="276" stroke="#5b6b66" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="430" y="540" text-anchor="middle" font-size="10.5" fill="#5b6b66">Zero npm runtime dependencies · offline-first · local SQLite + local ONNX embeddings</text>
</svg>
